<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1080px; overflow: hidden; }
      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        background: linear-gradient(135deg, #fff5f5 0%, #f0f7ff 50%, #f5fff8 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 80px;
        color: #2d3436;
      }
      .quote-mark {
        font-size: 180px;
        color: #ff7675;
        opacity: 0.3;
        line-height: 0.5;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 56px;
        font-weight: 900;
        line-height: 1.2;
        text-align: center;
        margin-bottom: 30px;
        color: #2d3436;
      }
      h1 .highlight { color: #e74c3c; }
      .sub {
        font-size: 32px;
        color: #636e72;
        text-align: center;
        line-height: 1.4;
        margin-bottom: 50px;
      }
      .solution {
        background: white;
        border-radius: 24px;
        padding: 50px;
        width: 100%;
        max-width: 860px;
        box-shadow: 0 8px 40px rgba(0,0,0,0.08);
        text-align: center;
      }
      .solution .label {
        font-size: 20px;
        color: #00b894;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 16px;
      }
      .solution .text {
        font-size: 36px;
        font-weight: 700;
        color: #2d3436;
        line-height: 1.3;
      }
      .solution .text .highlight { color: #00b894; }
      .cta {
        margin-top: 40px;
        font-size: 26px;
        color: #636e72;
      }
      .cta strong { color: #00b894; }
      .brand {
        position: absolute;
        bottom: 40px;
        font-size: 24px;
        color: #b2bec3;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="quote-mark">"</div>
    <h1>I Studied For 6 Months<br>And <span class="highlight">Still Failed</span></h1>
    <div class="sub">Sound familiar? You don't need more content.<br>You need better clinical reasoning.</div>
    <div class="solution">
      <div class="label">The Fix</div>
      <div class="text">The Clinical Judgment Mastery System teaches you <span class="highlight">HOW to think</span> — not just WHAT to know.</div>
    </div>
    <div class="cta">Link in Bio <strong>$47</strong></div>
    <div class="brand">obiomacare.com</div>
  </body>
</html>
