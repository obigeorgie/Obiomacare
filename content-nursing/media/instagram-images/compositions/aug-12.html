<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1080px; overflow: hidden; }
      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        background: #0f172a;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 80px;
        color: white;
      }
      h1 {
        font-size: 52px;
        font-weight: 900;
        text-align: center;
        margin-bottom: 50px;
        line-height: 1.2;
      }
      h1 .highlight { color: #fbbf24; }
      .comparison {
        display: flex;
        gap: 30px;
        width: 100%;
        max-width: 920px;
      }
      .card {
        flex: 1;
        background: rgba(255,255,255,0.06);
        border-radius: 24px;
        padding: 40px;
        border: 2px solid rgba(255,255,255,0.1);
      }
      .card .header {
        font-size: 22px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 20px;
      }
      .card .scenario {
        font-size: 26px;
        font-weight: 700;
        margin-bottom: 24px;
        line-height: 1.3;
      }
      .card .action {
        font-size: 30px;
        font-weight: 900;
        padding: 16px 24px;
        border-radius: 12px;
        text-align: center;
      }
      .card-left .header { color: #4ade80; }
      .card-left .action { background: rgba(74,222,128,0.15); color: #4ade80; border: 2px solid rgba(74,222,128,0.3); }
      .card-right .header { color: #f87171; }
      .card-right .action { background: rgba(248,113,113,0.15); color: #f87171; border: 2px solid rgba(248,113,113,0.3); }
      .vs {
        font-size: 40px;
        font-weight: 900;
        color: #fbbf24;
        align-self: center;
      }
      .lab-value {
        background: #fbbf24;
        color: #0f172a;
        font-size: 48px;
        font-weight: 900;
        padding: 20px 60px;
        border-radius: 16px;
        margin-bottom: 40px;
      }
      .brand {
        position: absolute;
        bottom: 40px;
        font-size: 24px;
        color: rgba(255,255,255,0.5);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>Same Lab.<br>Different Patient.<br><span class="highlight">Different Action.</span></h1>
    <div class="lab-value">K+ 3.2</div>
    <div class="comparison">
      <div class="card card-left">
        <div class="header">Stable Patient</div>
        <div class="scenario">No symptoms, stable vitals</div>
        <div class="action">Replace & Monitor</div>
      </div>
      <div class="vs">VS</div>
      <div class="card card-right">
        <div class="header">On Digoxin + PVCs</div>
        <div class="scenario">Cardiac risk, arrhythmia signs</div>
        <div class="action">PRIORITY</div>
      </div>
    </div>
    <div class="brand">obiomacare.com</div>
  </body>
</html>
