<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; }
      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        background: linear-gradient(180deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 80px 60px;
        color: white;
      }
      .fail-badge {
        background: #ff4757;
        color: white;
        font-size: 36px;
        font-weight: 900;
        padding: 16px 48px;
        border-radius: 16px;
        margin-bottom: 50px;
        text-transform: uppercase;
        letter-spacing: 4px;
      }
      h1 {
        font-size: 64px;
        font-weight: 900;
        text-align: center;
        line-height: 1.15;
        margin-bottom: 40px;
      }
      h1 .highlight { color: #ffd700; }
      .story {
        font-size: 32px;
        color: #a8d5e5;
        text-align: center;
        line-height: 1.5;
        margin-bottom: 50px;
        max-width: 900px;
      }
      .solution {
        background: rgba(0,212,170,0.15);
        border: 3px solid #00d4aa;
        border-radius: 24px;
        padding: 40px;
        text-align: center;
        margin-bottom: 40px;
      }
      .solution-title {
        font-size: 28px;
        font-weight: 800;
        color: #00d4aa;
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 2px;
      }
      .solution-text {
        font-size: 32px;
        font-weight: 700;
        line-height: 1.4;
      }
      .cta {
        font-size: 36px;
        font-weight: 900;
        color: #ffd700;
        text-align: center;
      }
      .brand {
        position: absolute;
        bottom: 50px;
        font-size: 28px;
        color: rgba(255,255,255,0.5);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="fail-badge">True Story</div>
    <h1>I Failed My First<br>Practice NCLEX<br>Because I <span class="highlight">Memorized Everything</span></h1>
    <div class="story">15 years of ER experience later, I built the system I wish I had.</div>
    <div class="solution">
      <div class="solution-title">The Fix</div>
      <div class="solution-text">30+ real scenarios. Video walkthroughs. Decision trees. $47.</div>
    </div>
    <div class="cta">→ obiomacare.com</div>
    <div class="brand">obiomacare.com</div>
  </body>
</html>
