<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; }
      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        background: linear-gradient(180deg, #1a0a0a 0%, #2d1810 50%, #1a0a0a 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 80px 60px;
        color: white;
      }
      .stop-sign {
        width: 180px;
        height: 180px;
        background: #ff4757;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 80px;
        font-weight: 900;
        margin-bottom: 50px;
      }
      h1 {
        font-size: 68px;
        font-weight: 900;
        text-align: center;
        line-height: 1.15;
        margin-bottom: 40px;
      }
      h1 .highlight { color: #ff4757; }
      .sub {
        font-size: 32px;
        color: #cc9988;
        text-align: center;
        line-height: 1.4;
        margin-bottom: 50px;
        max-width: 900px;
      }
      .solution {
        background: rgba(0,212,170,0.15);
        border: 3px solid #00d4aa;
        border-radius: 24px;
        padding: 40px;
        text-align: center;
        margin-bottom: 40px;
      }
      .solution-title {
        font-size: 28px;
        font-weight: 800;
        color: #00d4aa;
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 2px;
      }
      .solution-text {
        font-size: 32px;
        font-weight: 700;
        line-height: 1.4;
      }
      .cta {
        font-size: 36px;
        font-weight: 900;
        color: #ffd700;
        text-align: center;
      }
      .brand {
        position: absolute;
        bottom: 50px;
        font-size: 28px;
        color: rgba(255,255,255,0.5);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="stop-sign"><i data-lucide="hand" class="icon icon-warning icon-md" aria-label="Stop"></i></div>
    <h1>Stop Buying More<br><span class="highlight">NCLEX Review Books</span></h1>
    <div class="sub">You don't need more content. You need to learn how to THINK like a nurse.</div>
    <div class="solution">
      <div class="solution-title">What You Actually Need</div>
      <div class="solution-text">Clinical Judgment Framework<br>30+ Scenarios<br>Video Walkthroughs</div>
    </div>
    <div class="cta">$47 → obiomacare.com</div>
    <div class="brand">obiomacare.com</div>
  
    <!-- Lucide Icons — loaded once, hydrates all [data-lucide] elements -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script>document.addEventListener('DOMContentLoaded', function(){ if(window.lucide) lucide.createIcons(); });</script>
</body>
</html>
