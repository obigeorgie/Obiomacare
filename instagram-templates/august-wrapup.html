<!DOCTYPE html>
<html><head><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; background: linear-gradient(135deg, #0a1628 0%, #162544 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 80px; position: relative; overflow: hidden; }
.circle { position: absolute; width: 600px; height: 600px; border-radius: 50%; background: rgba(255,107,91,0.06); top: -200px; right: -200px; }
.circle2 { position: absolute; width: 400px; height: 400px; border-radius: 50%; background: rgba(255,107,91,0.04); bottom: -100px; left: -100px; }
.badge { position: absolute; top: 60px; left: 60px; background: #FF6B5B; color: white; padding: 16px 36px; border-radius: 40px; font-size: 28px; font-weight: 700; }
.title { font-size: 64px; font-weight: 800; text-align: center; line-height: 1.2; color: #e2e8f0; margin-bottom: 30px; }
.accent { color: #FF6B5B; }
.subtitle { font-size: 36px; color: #94a3b8; text-align: center; margin-bottom: 50px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; width: 100%; max-width: 900px; margin-bottom: 40px; }
.stat { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 32px; text-align: center; }
.stat-num { font-size: 52px; font-weight: 800; color: #FF6B5B; }
.stat-label { font-size: 28px; color: #94a3b8; margin-top: 8px; }
.goals { font-size: 32px; color: #e2e8f0; text-align: center; margin-top: 20px; }
.goals-title { font-weight: 700; color: #FF6B5B; margin-bottom: 12px; }
.footer { position: absolute; bottom: 60px; left: 0; right: 0; text-align: center; font-size: 32px; font-weight: 700; color: #FF6B5B; }
</style></head>
<body>
  <div class="circle"></div>
  <div class="circle2"></div>
  <div class="badge">August Wrap-Up</div>
  <div class="title">August Was a <span class="accent">BIG</span> Month</div>
  <div class="subtitle">at Obioma Care 🎉</div>
  <div class="stats">
    <div class="stat"><div class="stat-num">74</div><div class="stat-label">Study Guides</div></div>
    <div class="stat"><div class="stat-num">10</div><div class="stat-label">NGN Cases</div></div>
    <div class="stat"><div class="stat-num">4</div><div class="stat-label">Cheat Sheets</div></div>
    <div class="stat"><div class="stat-num">53</div><div class="stat-label">Community Nurses</div></div>
  </div>
  <div class="goals">
    <div class="goals-title">September Goals</div>
    100+ guides · 20+ cases · Live webinars
  </div>
  <div class="footer">obiomacare.com</div>
</body></html>
