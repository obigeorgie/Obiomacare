<!DOCTYPE html>
<html><head><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; background: linear-gradient(135deg, #0a1628 0%, #162544 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 80px; position: relative; overflow: hidden; }
.circle { position: absolute; width: 500px; height: 500px; border-radius: 50%; background: rgba(255,107,91,0.06); top: -150px; left: -150px; }
.title { font-size: 56px; font-weight: 800; text-align: center; line-height: 1.3; color: #e2e8f0; margin-bottom: 50px; }
.accent { color: #FF6B5B; }
.comparison { display: flex; gap: 30px; width: 100%; max-width: 950px; }
.col { flex: 1; padding: 36px; border-radius: 24px; }
.col.before { background: rgba(255,255,255,0.05); }
.col.after { background: rgba(255,107,91,0.1); border: 2px solid #FF6B5B; }
.col-title { font-size: 40px; font-weight: 800; margin-bottom: 28px; text-align: center; }
.col-title.before { color: #94a3b8; }
.col-title.after { color: #FF6B5B; }
.item { font-size: 30px; margin-bottom: 18px; display: flex; align-items: flex-start; gap: 12px; line-height: 1.4; }
.x { color: #FF6B5B; font-weight: 800; }
.check { color: #4ade80; font-weight: 800; }
.footer { position: absolute; bottom: 60px; left: 0; right: 0; text-align: center; font-size: 32px; font-weight: 700; color: #FF6B5B; }
</style></head>
<body>
  <div class="circle"></div>
  <div class="title">How I Changed My<br><span class="accent">NCLEX Prep</span></div>
  <div class="comparison">
    <div class="col before">
      <div class="col-title before">BEFORE</div>
      <div class="item"><span class="x">❌</span> Memorized flashcards for 6 months</div>
      <div class="item"><span class="x">❌</span> Practice questions in isolation</div>
      <div class="item"><span class="x">❌</span> Focused on content, not reasoning</div>
      <div class="item"><span class="x">❌</span> Failed first attempt</div>
    </div>
    <div class="col after">
      <div class="col-title after">AFTER</div>
      <div class="item"><span class="check">✅</span> Learned CJMM framework</div>
      <div class="item"><span class="check">✅</span> Practiced full case studies</div>
      <div class="item"><span class="check">✅</span> Focused on clinical judgment</div>
      <div class="item"><span class="check">✅</span> Passed on first try</div>
    </div>
  </div>
  <div class="footer">obiomacare.com</div>
</body></html>
