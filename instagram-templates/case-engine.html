<!DOCTYPE html>
<html><head><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; background: linear-gradient(135deg, #0a1628 0%, #162544 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 80px; position: relative; overflow: hidden; }
.circle { position: absolute; width: 600px; height: 600px; border-radius: 50%; background: rgba(255,107,91,0.06); top: -200px; right: -200px; }
.badge { position: absolute; top: 60px; right: 60px; background: #FF6B5B; color: white; padding: 16px 40px; border-radius: 40px; font-size: 32px; font-weight: 700; }
.icon { font-size: 140px; margin-bottom: 40px; }
.title { font-size: 72px; font-weight: 800; text-align: center; line-height: 1.2; color: #e2e8f0; margin-bottom: 40px; }
.accent { color: #FF6B5B; }
.features { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 800px; margin-top: 20px; }
.feature { display: flex; align-items: center; gap: 20px; font-size: 36px; color: #e2e8f0; }
.dot { width: 20px; height: 20px; background: #FF6B5B; border-radius: 50%; flex-shrink: 0; }
.footer { position: absolute; bottom: 60px; left: 0; right: 0; text-align: center; font-size: 32px; font-weight: 700; color: #FF6B5B; }
</style></head>
<body>
  <div class="circle"></div>
  <div class="badge">NEW</div>
  <div class="icon">🎉</div>
  <div class="title">Interactive NGN<br><span class="accent">Case Engine</span></div>
  <div class="features">
    <div class="feature"><div class="dot"></div>10 real clinical scenarios</div>
    <div class="feature"><div class="dot"></div>SATA, ordering, single-choice</div>
    <div class="feature"><div class="dot"></div>Instant rationales</div>
    <div class="feature"><div class="dot"></div>Track your progress</div>
    <div class="feature"><div class="dot"></div>FREE</div>
  </div>
  <div class="footer">obiomacare.com/case-engine</div>
</body></html>
