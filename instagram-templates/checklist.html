<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1080px;
  background: linear-gradient(135deg, #0a1628 0%, #162544 100%);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 80px;
  position: relative;
  overflow: hidden;
}
.accent { color: #FF6B5B; }
.white { color: #e2e8f0; }
.muted { color: #94a3b8; }
.title {
  font-size: 72px;
  font-weight: 800;
  text-align: center;
  line-height: 1.2;
  margin-bottom: 40px;
}
.subtitle {
  font-size: 42px;
  font-weight: 600;
  text-align: center;
  line-height: 1.4;
}
.icon {
  font-size: 120px;
  margin-bottom: 40px;
}
.badge {
  position: absolute;
  top: 60px;
  right: 60px;
  background: #FF6B5B;
  color: white;
  padding: 16px 32px;
  border-radius: 40px;
  font-size: 28px;
  font-weight: 700;
}
.footer {
  position: absolute;
  bottom: 60px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 32px;
  font-weight: 700;
  color: #FF6B5B;
}
.circle {
  position: absolute;
  width: 400px;
  height: 400px;
  border-radius: 50%;
  background: rgba(255, 107, 91, 0.08);
  top: -100px;
  right: -100px;
}
.circle2 {
  position: absolute;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  background: rgba(255, 107, 91, 0.05);
  bottom: -80px;
  left: -80px;
}
.steps {
  display: flex;
  flex-direction: column;
  gap: 24px;
  width: 100%;
  max-width: 800px;
}
.step {
  display: flex;
  align-items: center;
  gap: 24px;
  font-size: 38px;
  color: #e2e8f0;
}
.step-num {
  width: 64px;
  height: 64px;
  background: #FF6B5B;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 32px;
  flex-shrink: 0;
}
.comparison {
  display: flex;
  gap: 40px;
  width: 100%;
}
.col {
  flex: 1;
  padding: 40px;
  border-radius: 24px;
}
.col-a { background: rgba(255,255,255,0.05); }
.col-b { background: rgba(255, 107, 91, 0.1); border: 2px solid #FF6B5B; }
.col-title {
  font-size: 36px;
  font-weight: 700;
  margin-bottom: 24px;
}
.col-item {
  font-size: 32px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
</style>
</head>
<body>
  <div class="circle"></div>
  <div class="circle2"></div>
  <div class="badge">FREE</div>
  <div class="icon">✓</div>
  <div class="title white">Clinical Judgment<br><span class="accent">Checklist</span></div>
  <div class="steps">
    <div class="step"><div class="step-num">1</div>Recognize Cues</div>
    <div class="step"><div class="step-num">2</div>Analyze Cues</div>
    <div class="step"><div class="step-num">3</div>Prioritize Hypotheses</div>
    <div class="step"><div class="step-num">4</div>Generate Solutions</div>
    <div class="step"><div class="step-num">5</div>Take Action → Evaluate</div>
  </div>
  <div class="footer">obiomacare.com</div>
</body>
</html>
