<!DOCTYPE html>
<html><head><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; background: linear-gradient(135deg, #0a1628 0%, #162544 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 80px; position: relative; overflow: hidden; }
.circle { position: absolute; width: 500px; height: 500px; border-radius: 50%; background: rgba(255,107,91,0.06); top: -150px; right: -150px; }
.title { font-size: 56px; font-weight: 800; text-align: center; line-height: 1.3; color: #e2e8f0; margin-bottom: 50px; }
.accent { color: #FF6B5B; }
.rights { display: flex; flex-direction: column; gap: 24px; width: 100%; max-width: 850px; }
.right { display: flex; align-items: center; gap: 24px; font-size: 42px; color: #e2e8f0; font-weight: 700; }
.check { width: 50px; height: 50px; background: #FF6B5B; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; color: white; flex-shrink: 0; }
.note { font-size: 32px; color: #94a3b8; text-align: center; margin-top: 50px; line-height: 1.5; max-width: 800px; }
.footer { position: absolute; bottom: 60px; left: 0; right: 0; text-align: center; font-size: 32px; font-weight: 700; color: #FF6B5B; }
</style></head>
<body>
  <div class="circle"></div>
  <div class="title">The 5 Rights of<br><span class="accent">Delegation</span></div>
  <div class="rights">
    <div class="right"><div class="check">✓</div>RIGHT TASK</div>
    <div class="right"><div class="check">✓</div>RIGHT CIRCUMSTANCE</div>
    <div class="right"><div class="check">✓</div>RIGHT PERSON</div>
    <div class="right"><div class="check">✓</div>RIGHT DIRECTION</div>
    <div class="right"><div class="check">✓</div>RIGHT SUPERVISION</div>
  </div>
  <div class="note">The NGN gives you a scenario and asks:<br>"Who do you delegate this to?"</div>
  <div class="footer">obiomacare.com/case-engine</div>
</body></html>
