<!DOCTYPE html>
<html><head><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; background: linear-gradient(135deg, #0a1628 0%, #162544 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 80px; position: relative; overflow: hidden; }
.circle { position: absolute; width: 500px; height: 500px; border-radius: 50%; background: rgba(255,107,91,0.06); bottom: -150px; left: -150px; }
.title { font-size: 68px; font-weight: 800; text-align: center; line-height: 1.2; color: #e2e8f0; margin-bottom: 60px; }
.accent { color: #FF6B5B; }
.mnemonics { display: flex; flex-direction: column; gap: 32px; width: 100%; max-width: 850px; }
.mnemonic { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 36px 48px; }
.mnemonic-term { font-size: 44px; font-weight: 800; color: #FF6B5B; margin-bottom: 8px; }
.mnemonic-def { font-size: 32px; color: #94a3b8; }
.cta { font-size: 38px; font-weight: 700; color: #e2e8f0; text-align: center; margin-top: 50px; }
.footer { position: absolute; bottom: 60px; left: 0; right: 0; text-align: center; font-size: 32px; font-weight: 700; color: #FF6B5B; }
</style></head>
<body>
  <div class="circle"></div>
  <div class="title">Which electrolyte<br><span class="accent">mnemonic</span> do YOU use?</div>
  <div class="mnemonics">
    <div class="mnemonic"><div class="mnemonic-term">SALT LOSS</div><div class="mnemonic-def">Hyponatremia causes</div></div>
    <div class="mnemonic"><div class="mnemonic-term">MURDER</div><div class="mnemonic-def">Hyperkalemia signs</div></div>
    <div class="mnemonic"><div class="mnemonic-term">CATS</div><div class="mnemonic-def">Hypocalcemia symptoms</div></div>
  </div>
  <div class="cta">Drop yours in the comments <i data-lucide="arrow-down" class="icon icon-coral icon-md" aria-label="Down"></i></div>
  <div class="footer">obiomacare.com</div>

    <!-- Lucide Icons — loaded once, hydrates all [data-lucide] elements -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script>document.addEventListener('DOMContentLoaded', function(){ if(window.lucide) lucide.createIcons(); });</script>
</body></html>
