<!DOCTYPE html>
<html><head><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; background: linear-gradient(135deg, #0a1628 0%, #162544 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 80px; position: relative; overflow: hidden; }
.circle { position: absolute; width: 600px; height: 600px; border-radius: 50%; background: rgba(255,107,91,0.06); bottom: -200px; right: -200px; }
.icon { font-size: 120px; margin-bottom: 40px; }
.title { font-size: 52px; font-weight: 800; text-align: center; line-height: 1.3; color: #e2e8f0; margin-bottom: 50px; }
.accent { color: #FF6B5B; }
.question { font-size: 44px; color: #e2e8f0; text-align: center; margin-bottom: 50px; font-weight: 700; max-width: 900px; }
.options { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 800px; }
.option { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 28px 36px; font-size: 34px; color: #94a3b8; }
.option.correct { background: rgba(255,107,91,0.15); border: 2px solid #FF6B5B; color: #e2e8f0; font-weight: 700; }
.answer { font-size: 40px; font-weight: 800; color: #FF6B5B; text-align: center; margin-top: 50px; }
.footer { position: absolute; bottom: 60px; left: 0; right: 0; text-align: center; font-size: 32px; font-weight: 700; color: #FF6B5B; }
</style></head>
<body>
  <div class="circle"></div>
  <div class="icon"><i data-lucide="pen-tool" class="icon icon-coral icon-md" aria-label="Write"></i></div>
  <div class="title">Fill in the blank</div>
  <div class="question">"The nurse's FIRST priority is ALWAYS ______."</div>
  <div class="options">
    <div class="option">A) Patient safety</div>
    <div class="option">B) Following doctor's orders</div>
    <div class="option">C) Completing documentation</div>
    <div class="option">D) Administering medications</div>
  </div>
  <div class="answer">Answer: A) Patient safety</div>
  <div class="footer">obiomacare.com</div>

    <!-- Lucide Icons — loaded once, hydrates all [data-lucide] elements -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script>document.addEventListener('DOMContentLoaded', function(){ if(window.lucide) lucide.createIcons(); });</script>
</body></html>
