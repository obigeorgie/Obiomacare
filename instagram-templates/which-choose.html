<!DOCTYPE html>
<html><head><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; background: linear-gradient(135deg, #0a1628 0%, #162544 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 80px; position: relative; overflow: hidden; }
.circle { position: absolute; width: 500px; height: 500px; border-radius: 50%; background: rgba(255,107,91,0.06); bottom: -150px; right: -150px; }
.title { font-size: 60px; font-weight: 800; text-align: center; line-height: 1.3; color: #e2e8f0; margin-bottom: 50px; }
.accent { color: #FF6B5B; }
.question { font-size: 40px; color: #94a3b8; text-align: center; margin-bottom: 50px; }
.options { display: flex; flex-direction: column; gap: 24px; width: 100%; max-width: 850px; }
.option { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 36px; font-size: 34px; color: #e2e8f0; font-weight: 700; }
.option.winner { background: rgba(255,107,91,0.15); border: 3px solid #FF6B5B; }
.label { font-size: 28px; color: #94a3b8; font-weight: 400; margin-top: 8px; }
.result { font-size: 44px; font-weight: 800; color: #FF6B5B; text-align: center; margin-top: 50px; }
.footer { position: absolute; bottom: 60px; left: 0; right: 0; text-align: center; font-size: 32px; font-weight: 700; color: #FF6B5B; }
</style></head>
<body>
  <div class="circle"></div>
  <div class="title">Which Would You<br><span class="accent">Choose?</span></div>
  <div class="question">The NGN tests thinking. Not recall.</div>
  <div class="options">
    <div class="option">Option A: 1,000 flashcards + 500 practice questions<div class="label">Memorization approach</div></div>
    <div class="option winner">Option B: 30 real case studies + clinical judgment framework<div class="label">Thinking approach</div></div>
  </div>
  <div class="result">Option B wins every time. <i data-lucide="brain" class="icon icon-coral icon-md" aria-label="Neurology"></i></div>
  <div class="footer">obiomacare.com</div>

    <!-- Lucide Icons — loaded once, hydrates all [data-lucide] elements -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script>document.addEventListener('DOMContentLoaded', function(){ if(window.lucide) lucide.createIcons(); });</script>
</body></html>
