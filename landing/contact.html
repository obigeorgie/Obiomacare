<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Obioma — We Read Everything</title>
<meta name="description" content="Contact Obioma — questions, feedback, or partnership inquiries. We read everything and reply to most.">
<link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
<link rel="stylesheet" href="/design-tokens/tokens.css">
<style>
  body{font-family:system-ui,sans-serif;background:#f6f8fb;color:#1a365d;margin:0}
  .page{padding:64px 20px}
  .container{max-width:680px;margin:0 auto}
  .page h1{font-size:2rem;margin:0 0 8px}
  .page .sub{color:#5b6b83;margin:0 0 36px;line-height:1.6}
  .form-card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:32px}
  label{display:block;font-weight:600;margin:0 0 6px;font-size:.95rem}
  input,textarea{width:100%;padding:12px 14px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;font-family:inherit;box-sizing:border-box;margin-bottom:20px}
  input:focus,textarea:focus{outline:2px solid #ff6b4a;border-color:transparent}
  textarea{min-height:140px;resize:vertical}
  button{background:#ff6b4a;color:#fff;border:0;border-radius:8px;padding:12px 26px;font-size:1rem;font-weight:600;cursor:pointer}
  button:hover{background:#e85a3c}
  button:disabled{opacity:.6;cursor:default}
  .hp{position:absolute;left:-9999px;opacity:0;height:0;overflow:hidden}
  .success,.error{display:none;border-radius:12px;padding:16px 20px;margin-bottom:20px;font-size:.95rem}
  .success{background:#e6f7ee;color:#14613c;border:1px solid #b7e5cd}
  .error{background:#fdeeee;color:#8f1d1d;border:1px solid #f5c6c6}
</style>
</head>
<body>

<section class="page">
  <div class="container">
    <h1>Contact Obioma</h1>
    <p class="sub">Questions, feedback, or partnership inquiries — we read everything and reply to most. Expect a response within a couple of business days.</p>

    <div class="form-card">
      <form id="contactForm">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required maxlength="100">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="How can we help?" required minlength="10" maxlength="5000"></textarea>

        <!-- Honeypot — humans never see this -->
        <div class="hp" aria-hidden="true">
          <label>Leave this field empty</label>
          <input type="text" name="website" tabindex="-1" autocomplete="off">
        </div>

        <button type="submit" id="submitBtn">Send message</button>
      </form>
    </div>
  </div>
</section>

<script>
document.getElementById('contactForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Sending…';
  const formEl = document.getElementById('contactForm');
  const old = document.getElementById('formStatus');
  if (old) old.remove();
  function showMessage(type, text) {
    const msg = document.createElement('div');
    msg.id = 'formStatus';
    msg.className = type;
    msg.setAttribute('role', 'status');
    msg.setAttribute('aria-live', 'polite');
    msg.innerHTML = text;
    formEl.parentNode.insertBefore(msg, formEl);
  }
  const payload = {
    name: document.getElementById('name').value,
    email: document.getElementById('email').value,
    message: document.getElementById('message').value,
    website: document.querySelector('input[name="website"]').value,
  };
  try {
    const r = await fetch('/api/contact', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (r.ok) {
      formEl.style.display = 'none';
      showMessage('success', '<strong>Message sent.</strong> Thanks for reaching out — we\'ll get back to you at the email you provided.');
      if (typeof window.ObiomaEvents !== 'undefined') window.ObiomaEvents.track('contact_submitted', { page: '/contact.html' });
    } else {
      throw new Error('Failed');
    }
  } catch (err) {
    showMessage('error', '<strong>Something went wrong.</strong> Please check your details and try again.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Send message';
  }
});
</script>

</body>
</html>
