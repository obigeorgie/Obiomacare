<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You — Obioma</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=GA_MEASUREMENT_ID"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'GA_MEASUREMENT_ID');
    </script>
    <!-- Facebook Pixel -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window,document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', 'FB_PIXEL_ID');
      fbq('track', 'PageView');
    </script>
    <noscript>
      <img height="1" width="1" style="display:none" 
           src="https://www.facebook.com/tr?id=FB_PIXEL_ID&ev=PageView&noscript=1"/>
    </noscript>
    <style>
        :root { --primary: #1a365d; --accent: #c53030; --bg-warm: #fffaf0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-warm); color: #2d3748; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { max-width: 600px; text-align: center; padding: 40px; }
        .icon { font-size: 4rem; margin-bottom: 24px; }
        h1 { color: var(--primary); font-size: 2rem; margin-bottom: 16px; }
        p { color: #64748b; font-size: 1.125rem; margin-bottom: 32px; }
        .btn { display: inline-block; background: var(--accent); color: white; padding: 16px 32px; border-radius: 8px; text-decoration: none; font-weight: 700; }
        .note { margin-top: 32px; padding: 24px; background: white; border-radius: 8px; }
    </style>
<!-- Cloudflare Web Analytics -->
<script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "156afa3b1ed1486cb0fc62708b1802ce"}'></script>
<!-- End Cloudflare Web Analytics -->
</head>
<body>
    <div class="container">
        <div class="icon"><i data-lucide="party-popper" class="icon icon-coral icon-md" aria-label="Celebrate"></i></div>
        <h1>Thank You for Your Purchase!</h1>
        <p>Your Clinical Judgment Mastery System is being prepared. Check your email in the next 2-3 minutes for your download link.</p>
        <a href="/" class="btn">Back to Homepage</a>
        <div class="note">
            <p style="margin: 0; font-size: 1rem; color: #2d3748;"><strong>What's next:</strong></p>
            <p style="margin: 8px 0 0; font-size: 0.875rem;">1. Download your files from the email<br>2. Start with the NGN Framework<br>3. Work through one scenario per day</p>
        </div>
    </div>
    <script>
        // Track purchase from URL params
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');
        if (sessionId) {
            if (typeof gtag !== 'undefined') {
                gtag('event', 'purchase', {
                    transaction_id: sessionId,
                    currency: 'USD'
                });
            }
            if (typeof fbq !== 'undefined') {
                fbq('track', 'Purchase', {
                    content_type: 'product',
                    currency: 'USD'
                });
            }
        }
    </script>

    <!-- Lucide Icons — loaded once, hydrates all [data-lucide] elements -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script>document.addEventListener('DOMContentLoaded', function(){ if(window.lucide) lucide.createIcons(); });</script>
</body>
</html>
