<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c53030;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9b2c2c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c5282;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)"/>
  
  <!-- Heart shape -->
  <path d="M100 155 C100 155 45 118 45 80 C45 58 63 44 82 44 C92 44 100 53 100 53 C100 53 108 44 118 44 C137 44 155 58 155 80 C155 118 100 155 100 155Z" 
        fill="url(#heartGrad)" 
        stroke="#fff" 
        stroke-width="2"
        stroke-linejoin="round"/>
  
  <!-- Clinical Judgment cross/plus inside heart -->
  <rect x="95" y="65" width="10" height="30" rx="2" fill="#fff" opacity="0.9"/>
  <rect x="85" y="75" width="30" height="10" rx="2" fill="#fff" opacity="0.9"/>
  
  <!-- ECG pulse line at bottom -->
  <polyline points="55,140 70,140 78,125 86,150 94,140 106,140 114,125 122,150 130,140 145,140" 
            fill="none" 
            stroke="#fff" 
            stroke-width="2.5" 
            stroke-linecap="round" 
            stroke-linejoin="round"
            opacity="0.9"/>
</svg>
