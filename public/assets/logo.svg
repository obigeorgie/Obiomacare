<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B5B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E85D4E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a5c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2137;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f8f9fa" stroke="#e9ecef" stroke-width="2"/>
  
  <!-- Heart shape -->
  <path d="M100 160 C100 160 40 120 40 80 C40 55 60 40 80 40 C90 40 100 50 100 50 C100 50 110 40 120 40 C140 40 160 55 160 80 C160 120 100 160 100 160Z" 
        fill="url(#heartGrad)" 
        stroke="#d94e3f" 
        stroke-width="2"
        stroke-linejoin="round"/>
  
  <!-- Brain/AI neural network inside heart -->
  <circle cx="85" cy="75" r="4" fill="#1a3a5c"/>
  <circle cx="115" cy="75" r="4" fill="#1a3a5c"/>
  <circle cx="100" cy="65" r="4" fill="#1a3a5c"/>
  <circle cx="75" cy="90" r="4" fill="#1a3a5c"/>
  <circle cx="125" cy="90" r="4" fill="#1a3a5c"/>
  <circle cx="85" cy="105" r="4" fill="#1a3a5c"/>
  <circle cx="115" cy="105" r="4" fill="#1a3a5c"/>
  <circle cx="100" cy="95" r="5" fill="#0d2137"/>
  
  <!-- Neural connections -->
  <line x1="85" y1="75" x2="100" y2="65" stroke="#1a3a5c" stroke-width="1.5" opacity="0.7"/>
  <line x1="115" y1="75" x2="100" y2="65" stroke="#1a3a5c" stroke-width="1.5" opacity="0.7"/>
  <line x1="85" y1="75" x2="75" y2="90" stroke="#1a3a5c" stroke-width="1.5" opacity="0.7"/>
  <line x1="115" y1="75" x2="125" y2="90" stroke="#1a3a5c" stroke-width="1.5" opacity="0.7"/>
  <line x1="75" y1="90" x2="85" y2="105" stroke="#1a3a5c" stroke-width="1.5" opacity="0.7"/>
  <line x1="125" y1="90" x2="115" y2="105" stroke="#1a3a5c" stroke-width="1.5" opacity="0.7"/>
  <line x1="85" y1="105" x2="100" y2="95" stroke="#1a3a5c" stroke-width="1.5" opacity="0.7"/>
  <line x1="115" y1="105" x2="100" y2="95" stroke="#1a3a5c" stroke-width="1.5" opacity="0.7"/>
  <line x1="100" y1="65" x2="100" y2="95" stroke="#1a3a5c" stroke-width="1.5" opacity="0.7"/>
  <line x1="85" y1="75" x2="115" y2="75" stroke="#1a3a5c" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Stethoscope hint forming O -->
  <path d="M55 85 Q50 100 65 115" fill="none" stroke="#0d2137" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <circle cx="65" cy="115" r="3" fill="#0d2137" opacity="0.6"/>
  
  <!-- Small pulse/heartbeat line at bottom -->
  <polyline points="70,145 80,145 85,135 90,150 95,145 105,145 110,135 115,150 120,145 130,145" 
            fill="none" 
            stroke="#FF6B5B" 
            stroke-width="2" 
            stroke-linecap="round" 
            stroke-linejoin="round"
            opacity="0.8"/>
</svg>
