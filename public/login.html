<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — ObiomaCare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0f0f1a;
      color: #e2e2e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #1a1a2e;
      border: 1px solid #2a2a3e;
      border-radius: 16px;
      padding: 48px;
      width: 100%;
      max-width: 420px;
      margin: 24px;
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo a {
      color: #8b5cf6;
      text-decoration: none;
      font-size: 24px;
      font-weight: 700;
    }
    .logo p {
      color: #888;
      font-size: 14px;
      margin-top: 4px;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
      text-align: center;
    }
    .subtitle {
      color: #888;
      font-size: 14px;
      text-align: center;
      margin-bottom: 32px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #b4b4c0;
    }
    input[type="email"] {
      width: 100%;
      padding: 12px 16px;
      background: #0f0f1a;
      border: 1px solid #2a2a3e;
      border-radius: 8px;
      color: #e2e2e8;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="email"]:focus {
      border-color: #8b5cf6;
    }
    input::placeholder {
      color: #555;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover:not(:disabled) {
      background: #4338ca;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      display: none;
    }
    .message.success {
      background: #064e3b;
      color: #34d399;
      display: block;
    }
    .message.error {
      background: #450a0a;
      color: #f87171;
      display: block;
    }
    .divider {
      margin: 24px 0;
      text-align: center;
      position: relative;
    }
    .divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: #2a2a3e;
    }
    .divider span {
      background: #1a1a2e;
      padding: 0 12px;
      position: relative;
      color: #666;
      font-size: 13px;
    }
    .signup-link {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: #888;
    }
    .signup-link a {
      color: #8b5cf6;
      text-decoration: none;
    }
    .signup-link a:hover {
      text-decoration: underline;
    }
    .security-note {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #555;
    }
    @media (max-width: 480px) {
      .login-card { padding: 32px 24px; }
    }
  </style>
<!-- Cloudflare Web Analytics -->
<script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "156afa3b1ed1486cb0fc62708b1802ce"}'></script>
<!-- End Cloudflare Web Analytics -->
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <a href="/">ObiomaCare</a>
      <p>NCLEX Next Gen Prep</p>
    </div>

    <h1>Welcome back</h1>
    <p class="subtitle">Enter your email to receive a secure login link.</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@nursingschool.edu" required autofocus>
      </div>
      <button type="submit" id="submitBtn">Send Login Link</button>
    </form>

    <div id="message" class="message"></div>

    <div class="divider"><span>No password needed</span></div>

    <p class="signup-link">
      Don't have an account? <a href="/pricing">Get started free</a>
    </p>
    <p class="security-note">
      🔒 We use magic links — no passwords to remember or steal.
    </p>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const message = document.getElementById('message');

    // Check for error param
    const params = new URLSearchParams(window.location.search);
    const error = params.get('error');
    if (error) {
      message.className = 'message error';
      const errors = {
        missing_token: 'Login link is missing. Please request a new one.',
        invalid_token: 'This login link has expired or is invalid. Please request a new one.',
        not_configured: 'Authentication is not fully configured. Please try again later.',
      };
      message.textContent = errors[error] || 'Something went wrong. Please try again.';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';
      message.className = 'message';
      message.textContent = '';

      try {
        const res = await fetch('/api/auth/send-link', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();

        if (data.success) {
          message.className = 'message success';
          message.innerHTML = `
            <strong>Link sent!</strong><br>
            Check ${email} for your login link. It expires in 10 minutes.
            ${data._token ? `<br><small style="color:#888">Dev token: ${data._token}</small>` : ''}
          `;
          form.reset();
        } else {
          throw new Error(data.error || 'Failed to send link');
        }
      } catch (err) {
        message.className = 'message error';
        message.textContent = err.message;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Login Link';
      }
    });
  </script>
  <script src="/assets/revenue-events.js" defer></script>
</body>
</html>
