<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60">
  <!-- Brand Colors:
       Primary Red: #e56254
       Text Dark: #0e1829
       White: #ffffff
  -->
  
  <!-- Icon Circle -->
  <g transform="translate(6, 6)">
    <circle cx="24" cy="24" r="22" fill="#e56254"/>
    
    <!-- Inner heart/network icon (white) -->
    <g fill="white">
      <!-- Central node -->
      <circle cx="24" cy="22" r="4.5"/>
      <!-- Surrounding nodes forming heart shape -->
      <circle cx="16" cy="16" r="3"/>
      <circle cx="32" cy="16" r="3"/>
      <circle cx="14" cy="26" r="2.5"/>
      <circle cx="34" cy="26" r="2.5"/>
      <circle cx="24" cy="34" r="3"/>
    </g>
    
    <!-- Connection lines -->
    <g stroke="white" stroke-width="2" stroke-linecap="round" fill="none">
      <line x1="24" y1="22" x2="16" y2="16"/>
      <line x1="24" y1="22" x2="32" y2="16"/>
      <line x1="24" y1="22" x2="14" y2="26"/>
      <line x1="24" y1="22" x2="34" y2="26"/>
      <line x1="24" y1="22" x2="24" y2="34"/>
      <line x1="16" y1="16" x2="14" y2="26" opacity="0.7"/>
      <line x1="32" y1="16" x2="34" y2="26" opacity="0.7"/>
      <line x1="14" y1="26" x2="24" y2="34" opacity="0.7"/>
      <line x1="34" y1="26" x2="24" y2="34" opacity="0.7"/>
    </g>
  </g>
  
  <!-- Obioma Text -->
  <text x="62" y="38" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="30" 
        font-weight="700" 
        fill="#0e1829" 
        letter-spacing="-0.01em">Obioma.</text>
</svg>
