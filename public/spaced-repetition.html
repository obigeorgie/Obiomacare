<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spaced Repetition — ObiomaCare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0f0f1a;
      color: #e2e2e8;
      min-height: 100vh;
    }
    .container { max-width: 640px; margin: 0 auto; padding: 24px; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #2a2a3e;
    }
    .logo a {
      color: #8b5cf6;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
    }
    .stats-bar {
      display: flex;
      gap: 16px;
      font-size: 13px;
      color: #888;
    }
    .stats-bar span strong {
      color: #e2e2e8;
    }

    /* Auth gate */
    .auth-gate {
      text-align: center;
      padding: 80px 24px;
    }
    .auth-gate h2 { margin-bottom: 12px; }
    .auth-gate p { color: #888; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      background: #4f46e5;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      font-size: 15px;
    }
    .btn:hover { background: #4338ca; }

    /* Card */
    .card-container {
      perspective: 1000px;
      margin-bottom: 24px;
    }
    .flashcard {
      background: #1a1a2e;
      border: 1px solid #2a2a3e;
      border-radius: 16px;
      padding: 40px;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      transition: transform 0.3s;
    }
    .flashcard .category {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8b5cf6;
      margin-bottom: 16px;
    }
    .flashcard .front {
      font-size: 18px;
      line-height: 1.6;
      font-weight: 500;
    }
    .flashcard .back {
      font-size: 16px;
      line-height: 1.6;
      color: #b4b4c0;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #2a2a3e;
      display: none;
    }
    .flashcard.revealed .back { display: block; }

    /* Reveal button */
    .reveal-btn {
      width: 100%;
      padding: 16px;
      background: #2a2a3e;
      color: #e2e2e8;
      border: 1px solid #3a3a4e;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .reveal-btn:hover { background: #3a3a4e; }

    /* Grade buttons */
    .grade-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      display: none;
    }
    .grade-buttons.visible {
      display: grid;
    }
    .grade-btn {
      padding: 14px 8px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    .grade-btn:hover { transform: translateY(-2px); opacity: 0.9; }
    .grade-btn:active { transform: translateY(0); }
    .grade-again { background: #450a0a; color: #f87171; }
    .grade-hard { background: #3f2e18; color: #fbbf24; }
    .grade-good { background: #064e3b; color: #34d399; }
    .grade-easy { background: #1e3a5f; color: #60a5fa; }
    .grade-label {
      font-size: 11px;
      opacity: 0.7;
      margin-top: 4px;
      display: block;
    }

    /* Done state */
    .done-state {
      text-align: center;
      padding: 60px 24px;
    }
    .done-state h2 {
      font-size: 28px;
      margin-bottom: 12px;
      color: #34d399;
    }
    .done-state p { color: #888; margin-bottom: 8px; }
    .done-state .streak {
      font-size: 48px;
      margin: 16px 0;
    }
    .done-state .actions {
      margin-top: 32px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-secondary {
      background: #2a2a3e;
      color: #e2e2e8;
    }
    .btn-secondary:hover { background: #3a3a4e; }

    /* Loading */
    .loading {
      text-align: center;
      padding: 100px;
      color: #666;
    }

    @media (max-width: 480px) {
      .container { padding: 16px; }
      .flashcard { padding: 28px 20px; min-height: 220px; }
      .flashcard .front { font-size: 16px; }
      .grade-btn { padding: 12px 4px; font-size: 12px; }
    }
  </style>
<!-- Cloudflare Web Analytics -->
<script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "156afa3b1ed1486cb0fc62708b1802ce"}'></script>
<!-- End Cloudflare Web Analytics -->
</head>
<body>
  <div class="container">
    <header>
      <div class="logo"><a href="/">ObiomaCare</a></div>
      <div class="stats-bar" id="statsBar">
        <span>Due: <strong id="dueCount">—</strong></span>
        <span>Done: <strong id="doneCount">0</strong></span>
        <span>Streak: <strong id="streakCount">—</strong></span>
      </div>
    </header>

    <div id="app">
      <div class="loading">Loading your cards...</div>
    </div>
  </div>

  <script>
    const app = document.getElementById('app');
    const dueCountEl = document.getElementById('dueCount');
    const doneCountEl = document.getElementById('doneCount');
    const streakCountEl = document.getElementById('streakCount');

    let currentCard = null;
    let sessionStats = { done: 0 };

    async function init() {
      // Check auth
      const authRes = await fetch('/api/auth/me');
      if (authRes.status === 401) {
        app.innerHTML = `
          <div class="auth-gate">
            <h2>Spaced Repetition</h2>
            <p>Log in to start your personalized review session. Cards are generated from your readiness assessment results.</p>
            <a href="/login" class="btn">Log In to Start</a>
          </div>
        `;
        return;
      }

      loadNextCard();
    }

    async function loadNextCard() {
      app.innerHTML = '<div class="loading">Loading next card...</div>';

      try {
        const res = await fetch('/api/sr/next');
        const data = await res.json();

        if (data.done) {
          showDoneState(data);
          return;
        }

        currentCard = data.card;
        dueCountEl.textContent = data.dueCount || 0;
        streakCountEl.textContent = data.stats?.streakDays || 0;

        renderCard(data.card);
      } catch (err) {
        app.innerHTML = `<div class="auth-gate"><h2>Error</h2><p>${escapeHtml(err.message)}</p></div>`;
      }
    }

    function renderCard(card) {
      app.innerHTML = `
        <div class="card-container">
          <div class="flashcard" id="flashcard">
            <div class="category">${escapeHtml(card.category)}</div>
            <div class="front">${escapeHtml(card.front)}</div>
            <div class="back" id="back">${escapeHtml(card.back || 'No explanation available.')}</div>
          </div>
        </div>
        <button class="reveal-btn" id="revealBtn" onclick="revealCard()">Show Answer</button>
        <div class="grade-buttons" id="gradeButtons">
          <button class="grade-btn grade-again" onclick="gradeCard(1)">
            Again
            <span class="grade-label">&lt; 1 min</span>
          </button>
          <button class="grade-btn grade-hard" onclick="gradeCard(2)">
            Hard
            <span class="grade-label">2-3 days</span>
          </button>
          <button class="grade-btn grade-good" onclick="gradeCard(3)">
            Good
            <span class="grade-label">~1 week</span>
          </button>
          <button class="grade-btn grade-easy" onclick="gradeCard(4)">
            Easy
            <span class="grade-label">~2 weeks</span>
          </button>
        </div>
      `;
    }

    function revealCard() {
      document.getElementById('flashcard').classList.add('revealed');
      document.getElementById('revealBtn').style.display = 'none';
      document.getElementById('gradeButtons').classList.add('visible');
    }

    async function gradeCard(grade) {
      if (!currentCard) return;

      document.getElementById('gradeButtons').style.opacity = '0.5';
      document.getElementById('gradeButtons').style.pointerEvents = 'none';

      try {
        const res = await fetch('/api/sr/answer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cardId: currentCard.id, grade }),
        });
        const data = await res.json();

        sessionStats.done++;
        doneCountEl.textContent = sessionStats.done;

        loadNextCard();
      } catch (err) {
        app.innerHTML = `<div class="auth-gate"><h2>Error</h2><p>${escapeHtml(err.message)}</p></div>`;
      }
    }

    function showDoneState(data) {
      const stats = data.stats || {};
      app.innerHTML = `
        <div class="done-state">
          <div class="streak">🔥</div>
          <h2>Session Complete!</h2>
          <p>You reviewed <strong>${sessionStats.done}</strong> cards today.</p>
          <p>Current streak: <strong>${stats.streakDays || 0}</strong> days</p>
          <p>Longest streak: <strong>${stats.longestStreak || 0}</strong> days</p>
          <div class="actions">
            <a href="/" class="btn btn-secondary">Back to Home</a>
            <a href="/account" class="btn">My Account</a>
          </div>
        </div>
      `;
      dueCountEl.textContent = data.dueCount || 0;
      streakCountEl.textContent = stats.streakDays || 0;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    init();
  </script>
  <script src="/assets/revenue-events.js" defer></script>
</body>
</html>
