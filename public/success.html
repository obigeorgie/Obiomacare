<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to ObiomaCare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0f0f1a;
      color: #e2e2e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .container { max-width: 480px; padding: 24px; }
    .check {
      width: 64px;
      height: 64px;
      background: #34d399;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 32px;
    }
    h1 { font-size: 28px; margin-bottom: 12px; }
    p { color: #888; font-size: 16px; line-height: 1.6; margin-bottom: 8px; }
    .tier-name {
      display: inline-block;
      background: #8b5cf6;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin: 8px 0;
    }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      background: #4f46e5;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      margin-top: 24px;
    }
    .btn:hover { background: #4338ca; }
    .features {
      text-align: left;
      background: #1a1a2e;
      border: 1px solid #2a2a3e;
      border-radius: 12px;
      padding: 20px;
      margin-top: 24px;
    }
    .features h3 { font-size: 14px; margin-bottom: 12px; color: #b4b4c0; }
    .features li { list-style: none; padding: 6px 0; color: #888; font-size: 14px; }
    .features li::before { content: "✓ "; color: #34d399; }
  </style>
</head>
<body>
  <div class="container">
    <div class="check">✓</div>
    <h1>Welcome to ObiomaCare</h1>
    <p>Your subscription is active.</p>
    <div id="tierBadge" class="tier-name">Loading...</div>
    <p id="message">Redirecting you to your account...</p>
    <a href="/account" class="btn">Go to My Account</a>

    <div class="features" id="features">
      <h3>What's included</h3>
      <ul id="featureList">
        <li>Loading...</li>
      </ul>
    </div>
  </div>

  <script>
    const TIER_FEATURES = {
      student_monthly: [
        'Unlimited readiness assessments',
        'Spaced repetition flashcards',
        'Progress sync across devices',
        'Printable study PDFs',
        '5 AI tutor credits',
        'Priority email support',
        'Cancel anytime',
      ],
      student_annual: [
        'Unlimited readiness assessments',
        'Spaced repetition flashcards',
        'Progress sync across devices',
        'Printable study PDFs',
        '5 AI tutor credits',
        'Priority email support',
        '14-day free trial',
        'Save 35% vs monthly',
      ],
      lifetime: [
        'Lifetime access — pay once',
        'Unlimited readiness assessments',
        'Spaced repetition flashcards',
        'Progress sync across devices',
        'Printable study PDFs',
        'Unlimited AI tutor credits',
        'Priority email support',
        'All future updates included',
      ],
    };

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get('session_id');
      const tier = params.get('tier');

      // Display tier
      const tierBadge = document.getElementById('tierBadge');
      const tierNames = {
        student_monthly: 'Student Monthly',
        student_annual: 'Student Annual',
        lifetime: 'Lifetime',
      };

      if (tier && tierNames[tier]) {
        tierBadge.textContent = tierNames[tier];
        const features = TIER_FEATURES[tier] || TIER_FEATURES.student_monthly;
        document.getElementById('featureList').innerHTML = features.map(f => `<li>${f}</li>`).join('');
      } else if (params.get('test_mode')) {
        tierBadge.textContent = 'Test Mode';
        document.getElementById('message').textContent = 'This was a test checkout — no charge was made.';
      } else {
        tierBadge.textContent = 'Active';
      }

      // If session_id exists, verify with backend
      if (sessionId) {
        try {
          const res = await fetch(`/api/verify-checkout?session_id=${sessionId}`);
          const data = await res.json();
          if (data.tier) {
            tierBadge.textContent = tierNames[data.tier] || data.tier;
          }
        } catch (e) {
          console.log('Session verification skipped');
        }
      }
    }

    init();
  </script>
</body>
</html>
