name = "obiomacare-site"
main = "workers-site/index.js"
compatibility_date = "2026-08-14"
account_id = "7331f696a15eee3fe7bf94f41376f7b8"

routes = [
  { pattern = "obiomacare.com/*", zone_id = "764dadccabdd5b0d558cd063c49264b8" },
  { pattern = "www.obiomacare.com/*", zone_id = "764dadccabdd5b0d558cd063c49264b8" },
  { pattern = "app.obiomacare.com/*", zone_id = "764dadccabdd5b0d558cd063c49264b8" }
]
workers_dev = true

[site]
bucket = "./public"

[[kv_namespaces]]
binding = "readiness_sessions"
id = "8d942c4cf31a442483e832d5a392ad1b"

# Auth users KV
[[kv_namespaces]]
binding = "users"
id = "c8a6959ce7a54d5c8092c8ddcc4d175e"

# Revenue OS — funnel events KV (Phase 1)
[[kv_namespaces]]
binding = "events"
id = "086045e4c2324add985328ec7e793d4f"

# Media storage bucket
[[r2_buckets]]
bucket_name = "obiomacare-media"
binding = "MEDIA_BUCKET"
